project_id = "liga-cna"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/admin/submissions"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.cna-ingest]
# Custom integration-token authentication runs before all request processing.
verify_jwt = false

[functions.cna-extract]
verify_jwt = true

